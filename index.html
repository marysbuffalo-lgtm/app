<title>Day To Day Online</title>

<script>(function () {
  document.documentElement.className = "js";
  var website = "https://daytoday.ae/";
  var stores = {
    ios: { url: "https://apps.apple.com/ae/app/day-to-day-online/id6504225370", name: "the App Store" },
    android: { url: "https://play.google.com/store/apps/details?id=com.daytodayonline", name: "Google Play" }
  };
  var storageKey = "dtd-routed-at";
  var rememberFor = 30 * 60 * 1000;

  function detectPlatform() {
    var ua = navigator.userAgent || "";
    var hints = navigator.userAgentData;
    if (/android/i.test(ua) || (hints && /android/i.test(hints.platform || ""))) return "android";
    if (/iphone|ipad|ipod/i.test(ua)) return "ios";
    if (/macintosh/i.test(ua) && navigator.maxTouchPoints > 1) return "ios";
    return "desktop";
  }

  function markRouted() {
    try {
      history.replaceState({ dtdRouted: true }, document.title);
    } catch (e) {}
    try {
      localStorage.setItem(storageKey, String(Date.now()));
    } catch (e) {}
  }

  function wasRouted() {
    try {
      if (history.state && history.state.dtdRouted) return true;
    } catch (e) {}
    try {
      var at = parseInt(localStorage.getItem(storageKey), 10);
      if (at && Date.now() - at >= 0 && Date.now() - at < rememberFor) return true;
    } catch (e) {}
    return false;
  }

  function goToWebsite() {
    location.replace(website);
  }

  var store = stores[detectPlatform()];

  if (!store || wasRouted()) {
    goToWebsite();
    return;
  }

  var leftPage = false;

  window.addEventListener("pageshow", function (event) {
    if (event.persisted && wasRouted()) goToWebsite();
  });

  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden") {
      leftPage = true;
    } else if (leftPage && wasRouted()) {
      goToWebsite();
    }
  });

  document.addEventListener("DOMContentLoaded", function () {
    var button = document.getElementById("store-button");
    var status = document.getElementById("status-text");
    if (status) status.textContent = "Opening " + store.name;
    if (button) {
      button.href = store.url;
      button.addEventListener("click", markRouted);
    }
  });

  window.onload = function () {
    markRouted();
    location.href = store.url;
  };
})();</script>
<style>*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;align-items:center;justify-content:center;padding:24px 16px;background:#fdf2f6;background-image:radial-gradient(circle at 15% 10%,#fde1eb 0,transparent 45%),radial-gradient(circle at 90% 95%,#fbe3ec 0,transparent 40%);color:#2b2230;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
.card{width:100%;max-width:400px;padding:40px 28px 32px;background:#fff;border-radius:24px;box-shadow:0 1px 2px rgba(43,34,48,.04),0 12px 40px rgba(226,25,89,.12);text-align:center;transition:padding .3s ease}
.logo{display:block;width:100%;max-width:260px;height:auto;margin:0 auto 24px}
h1{margin:0;font-size:1.5rem;font-weight:700;letter-spacing:-.01em;color:#2b2230}
.tagline{margin:6px 0 0;font-size:1rem;color:#e21959;font-weight:600}
.status{display:none;align-items:center;justify-content:center;gap:10px;margin:28px 0 24px;font-size:.9375rem;color:#6b5f70}
.spinner{flex:none;width:18px;height:18px;border:2.5px solid #f6c3d4;border-top-color:#e21959;border-radius:50%;animation:spin .8s linear infinite}
.button{display:flex;align-items:center;justify-content:center;width:100%;min-height:54px;padding:14px 20px;border-radius:14px;background:#e21959;background-image:linear-gradient(180deg,#ea2a68,#d4134f);color:#fff;font-size:1.0625rem;font-weight:600;text-decoration:none;box-shadow:0 6px 18px rgba(226,25,89,.32);-webkit-tap-highlight-color:transparent;transition:transform .15s ease,box-shadow .15s ease,padding .3s ease}
.button:hover{box-shadow:0 8px 22px rgba(226,25,89,.4)}
.button:active{transform:scale(.98);box-shadow:0 3px 10px rgba(226,25,89,.3)}
.button:focus-visible,.site-link:focus-visible{outline:3px solid #2b2230;outline-offset:3px}
.stores{display:flex;gap:10px;margin-top:28px}
.site-link{display:inline-block;margin-top:20px;padding:6px 4px;font-size:.9375rem;color:#6b5f70;text-decoration:underline;text-underline-offset:3px}
.site-link:hover{color:#e21959}
#store-button{display:none}
.js .status,.js #store-button{display:flex}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:360px){.card{padding:32px 20px 26px}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:2.4s}.button,.card{transition:none}}</style>
</head>
